# Nixpacks configuration for Laravel on Railway
providers = ["php"]

[variables]
NIXPACKS_PHP_ROOT_DIR = "/public"
NIXPACKS_PHP_FALLBACK_PATH = "/index.php"

[phases.setup]
nixPkgs = [
    "php82",
    "php82Packages.composer",
    "php82Extensions.pdo_mysql",
    "php82Extensions.mbstring",
    "php82Extensions.gd",
    "php82Extensions.zip",
    "php82Extensions.curl",
    "php82Extensions.bcmath",
    "php82Extensions.intl",
    "nginx"
]

[phases.build]
cmds = [
    "composer install --no-dev --optimize-autoloader --no-interaction",
    "php artisan storage:link --force || true"
]

[start]
cmd = "php artisan migrate --force && php artisan config:cache && php artisan route:cache && php artisan view:cache && /assets/scripts/pre-start.sh"
